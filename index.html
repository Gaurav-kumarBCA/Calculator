<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="header">
        <h1>Hi, CALCULATOR</h1>
    </div>
    <div class="mainContainer">
        <div class="calBody">
            <input id="calDisplay" type="text" value="0" readonly>
            <div class="calbtnBody">
                <div id="box1" class="box" onclick="clearDisplay()">AC</div>
                <div id="box1" class="box" onclick="backspace()"><=</div>
                <div id="box1" class="box" onclick="appendValue('%')">%</div>
                <div class="box" onclick="appendValue('/')">/</div>
                <div class="box" onclick="appendValue('7')">7</div>
                <div class="box" onclick="appendValue('8')">8</div>
                <div class="box"onclick="appendValue('9')">9</div>
                <div class="box" onclick="appendValue('*')">X</div>
                <div class="box" onclick="appendValue('4')">4</div>
                <div class="box" onclick="appendValue('5')">5</div>
                <div class="box" onclick="appendValue('6')">6</div>
                <div class="box" onclick="appendValue('-')">-</div>
                <div class="box" onclick="appendValue('1')">1</div>
                <div class="box" onclick="appendValue('2')">2</div>
                <div class="box" onclick="appendValue('3')">3</div>
                <div class="box" onclick="appendValue('+')">+</div>
                <div class="box" onclick="appendValue('0')">0</div>
                <div class="box" onclick="appendValue('00')">00</div>
                <div class="box" onclick="appendValue('.')">.</div>
                <div class="box" onclick="calculater()">=</div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
